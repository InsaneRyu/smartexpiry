name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev gettext build-essential lld ccache libgmp-dev libmpfr-dev

      - name: Instalar Cython y Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3" buildozer

      - name: Mantener la misma llave de firma entre compilaciones (respaldo)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: smartexpiry-debug-keystore-v1

      - name: Usar la llave guardada en el repositorio, o crear una nueva
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Usando la llave guardada en el repositorio (debug.keystore)."
          elif [ -f ~/.android/debug.keystore ]; then
            echo "Usando la llave restaurada de la caché."
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Llave nueva creada."
          fi

      - name: Guardar la llave como Artifact (solo la primera vez)
        uses: actions/upload-artifact@v4
        with:
          name: llave-de-firma-guardar
          path: ~/.android/debug.keystore

      - name: Reutilizar descarga de Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Dar a esta compilación un número de versión único
        run: |
          sed -i "s/^android.numeric_version = .*/android.numeric_version = ${{ github.run_number }}/" buildozer.spec

      - name: Compilar APK
        run: buildozer -v android debug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartExpiry-apk
          path: bin/*.apk
